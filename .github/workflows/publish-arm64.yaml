name: Release ARM64

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-arm64.yaml'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'landing/**'
      - 'globals/**'
      - 'shared/**'
      - 'forks/**'
      - 'ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Pack
        uses: buildpacks/github-actions/setup-pack@v6.1.1
        with:
          pack-version: 0.40.9
      - name: Select live WordPress build endpoint
        id: wordpress
        shell: bash
        run: |
          endpoint='https://wp.druminstructor.online/graphql'
          if ! curl --fail --silent --show-error --max-time 20 "$endpoint?query=%7B__typename%7D" > /dev/null; then
            endpoint='https://wp.drumin.pro/graphql'
            printf '127.0.0.1 localhost\n37.140.192.245 wp.drumin.pro\n' > "$RUNNER_TEMP/wordpress-hosts"
            curl --fail --silent --show-error --max-time 20 --resolve wp.drumin.pro:443:37.140.192.245 "$endpoint?query=%7B__typename%7D" > /dev/null
            echo "hosts=$RUNNER_TEMP/wordpress-hosts" >> "$GITHUB_OUTPUT"
          fi
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
      - name: Verify real homepage content
        shell: bash
        env:
          WORDPRESS_GRAPHQL_URL: ${{ steps.wordpress.outputs.endpoint }}
          WORDPRESS_HOSTS: ${{ steps.wordpress.outputs.hosts }}
        run: |
          args=(--fail --silent --show-error --max-time 30)
          if [ -n "$WORDPRESS_HOSTS" ]; then
            args+=(--resolve wp.drumin.pro:443:37.140.192.245)
          fi
          curl "${args[@]}" --header 'Content-Type: application/json' --data '{"query":"{ generalFragment(id: \"cG9zdDoyNTQ5\") { main { hero { title } } } }"}' "$WORDPRESS_GRAPHQL_URL" --output "$RUNNER_TEMP/wordpress-home.json"
          node -e 'const fs=require("node:fs");const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(data.errors?.length||!data.data?.generalFragment?.main?.hero?.title)process.exit(1);console.log("Live WordPress homepage content verified")' "$RUNNER_TEMP/wordpress-home.json"
      - name: Build native ARM64 image
        shell: bash
        env:
          SKILLS_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORDPRESS_GRAPHQL_URL: ${{ steps.wordpress.outputs.endpoint }}
          WORDPRESS_HOSTS: ${{ steps.wordpress.outputs.hosts }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drum-instructor-landing-renderer-entrypoint:$GITHUB_SHA-arm64"
          args=(build "$image" --builder ghcr.io/atls/builder-base:24 --buildpack ghcr.io/atls/buildpack-yarn-workspace:24 --path "$GITHUB_WORKSPACE" --env WORKSPACE=@landing/renderer-entrypoint --env SKILLS_NPM_TOKEN --env WORDPRESS_GRAPHQL_URL --env YARN_PNP_ENABLE_ESM_LOADER=false --trust-builder)
          if [ -n "$WORDPRESS_HOSTS" ]; then
            args+=(--volume "$WORDPRESS_HOSTS:/etc/hosts:ro")
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--publish --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drum-instructor-landing-renderer-entrypoint:arm64")
          fi
          pack "${args[@]}"
